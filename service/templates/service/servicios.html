{% extends 'core/base.html' %}

{% block title %} Servicios {% endblock %}

{% block content %}
    <div class="container">
            <div class="card">                            
                <div class="row" >
                    {% for service in services %}
                        <div class="col-4">
                            
                                <img src="{{service.image.url}}" class="card-img-top img-mediana"  alt="...">
                                <div class="card-body">
                                    <br>
                                    <h3 class="card-title text-center">{{service.title}}</h3>
                                    <p class="card-text">{{service.description}}</p>
                                </div>
                              
                        </div> 
                    {% endfor %}        
                </div>                                                      
            </div>             
        </div>    
{% endblock %}
